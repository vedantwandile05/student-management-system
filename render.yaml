# Render Blueprint (optional). You can also create the service manually in the dashboard.
services:
  - type: web
    name: student-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: starter        # multiple instances need a paid plan (free runs a single instance)
    numInstances: 2      # horizontal scaling: 2 containers behind Render's load balancer
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_VERSION
        value: 20

  - type: web
    name: student-mcp-server
    runtime: node
    rootDir: mcp-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: API_BASE_URL   # your student-api URL, e.g. https://student-api.onrender.com
        sync: false
      - key: NODE_VERSION
        value: 20

  - type: web
    name: student-reports-service
    runtime: node
    rootDir: reports-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: API_BASE_URL   # your student-api URL, e.g. https://student-api.onrender.com
        sync: false
      - key: FRONTEND_URL   # optional: Netlify URL if the frontend will call this service
        sync: false
      - key: NODE_VERSION
        value: 20

  - type: web
    name: student-status-service
    runtime: node
    rootDir: status-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: FRONTEND_URL   # your Netlify URL
        sync: false
      - key: API_BASE_URL   # your student-api URL
        sync: false
      - key: MCP_URL        # your student-mcp-server URL
        sync: false
      - key: REPORTS_URL    # your student-reports-service URL
        sync: false
      - key: NODE_VERSION
        value: 20
